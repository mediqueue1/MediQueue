<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../chandan copy/style.css">

    <style>
        /* HERO TEXT */
        .hero-text {
            text-align: center;
            margin: 20px 0;
        }

/* SLIDER */
.slider {
    width: 100%;
    max-width: 1000px;
    height: 350px;
    margin: 20px auto;
    overflow: hidden;
    position: relative;
    border-radius: 10px;
}

/* SLIDES */
.slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 15s ease-in-out;
}

/* IMAGES */
.slides img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    flex-shrink: 0;
}

/* BUTTONS */
.prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 20px;
    border-radius: 50%;
}

.prev { left: 10px; }
.next { right: 10px; }

.prev:hover, .next:hover {
    background: rgba(0,0,0,0.8);
}

        /* DOCTOR SECTION */
        .doctor {
            padding: 50px 20px;
            text-align: center;
            background: #f4f4f4;
        }

        .doctor h2 {
            margin-bottom: 40px;
        }

        .doctor-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .doctor-card {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 16px;
            width: 220px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .doctor-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .doctor-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #eee;
        }

        .doctor-card h3 {
            margin: 10px 0 5px;
            font-size: 16px;
        }

        .doctor-card p {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
