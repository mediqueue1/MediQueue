 </table>

  <script>
async function loadQueue() {
  try {
    const response = await fetch("http://127.0.0.1:5000/api/queue");
    const data = await response.json();

    console.log("QUEUE DATA:", data); // DEBUG

    const tbody = document.querySelector("#queueTable tbody");
    tbody.innerHTML = "";

    // ✅ Get logged-in doctor
    const userData = JSON.parse(localStorage.getItem("userData"));
    console.log("USER DATA:", userData); // DEBUG

    const doctorId = userData?.user?.doctor_id;

    // ✅ FIXED FILTER
    const filteredData = data.filter(item => Number(item.doctor_id) === Number(doctorId));

    if (filteredData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">No patients in your queue</td>
        </tr>
      `;
      return;
    }

    filteredData.sort((a, b) => {
      if (a.status === "in_consultation") return -1;
      if (b.status === "in_consultation") return 1;
      return a.token_number - b.token_number;
    });

    filteredData.forEach((item, index) => {

         let statusLabel = "";
      if (item.status === "in_consultation") {
        statusLabel = "In Consultation";
      } else {
        statusLabel = "Waiting";
      }

      tbody.innerHTML += `
        <tr ${index === 0 ? 'class="current"' : ''}>
          <td>${index + 1}</td>
          <td>A-${item.token_number || '-'}</td>
          <td>${item.patient_id}</td>
          <td>${item.full_name || '-'}</td>
          <td>${item.appointment_date || '-'}</td>
          <td>${item.appointment_time || '-'}</td>
          <td>${statusLabel}</td>
        </tr>
      `;
    });

  } catch (error) {
    console.error("Queue load error:", error);
  }
}

loadQueue();
</script>
