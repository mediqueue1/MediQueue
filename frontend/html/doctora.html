<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctor Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #f5f7fb;
}

/* Sidebar */
.sidebar {
  width: 240px;
  height: 100vh;
  background: #ffffff;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo {
  padding: 20px;
  font-weight: bold;
}

.menu {
  padding: 10px;
}

.menu a {
  display: block;
  padding: 12px;
  margin: 5px 0;
  text-decoration: none;
  color: #333;
  border-radius: 6px;
}

.menu a:hover {
  background: #e6edff;
}

.menu .active {
  background: #d6e4ff;
  color: #1a73e8;
}

/* Bottom menu */
/* Apply SAME style to both menu and bottom menu */
.menu a,
.bottom-menu a {
  display: block;
  padding: 12px;
  margin: 5px 0;
  text-decoration: none;
  color: #333;
  border-radius: 6px;
  font-size: 14px;
}

/* Hover */
.menu a:hover,
.bottom-menu a:hover {
  background: #e6edff;
  color: #1a73e8;
}

/* Active */
.menu a.active,
.bottom-menu a.active {
  background: #d6e4ff;
  color: #1a73e8;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

/* Topbar */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.search {
  width: 300px;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.btn {
  background: #1a73e8;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
}

/* Card */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

th {
  background: #eef2ff;
  text-align: left;
}

.actions button {
  padding: 5px 8px;
  margin-right: 5px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.view { background: #d1ecf1; }
.edit { background: #fff3cd; }

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <div>
    <div class="logo"><h3>MediQueue</h3>
    <p>OPD Management</p>
    </div>

    <div class="menu">
      <a href="admin.html">🏥Dashboard</a>
      <a href="patienta.html">👦Patient</a>
      <a href="doctora.html" class="active">🧑‍⚕️Doctor</a>
      <a href="receptionistsa.html">👩‍⚕️Receptionist</a>
      <a href="queuea.html">⏰Queue</a>
    </div>
  </div>

  <div class="bottom-menu">
    <a href="index.html">🏠Home</a>
    <a href="login.html">🚪Logout</a>
  </div>
</div>

<!-- Main -->
<div class="main">

  <div class="topbar">
    <input type="text" id="search" class="search" placeholder="Search doctors...">
    <a href="adddoctor.html"><button class="btn">Add New Doctor</button></a>
  </div>

  <div class="card">
    <h3>All Doctors</h3>

    <table id="doctorTable">
      <thead>
        <tr>
          <th>Doctor ID</th>
          <th>First Name</th>
          <th>Middle Name</th>
          <th>Last Name</th>
          <th>Specialization</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Department ID</th>
          <th>Available From</th>
          <th>Available To</th>
          <th>Username</th>
          <!-- <th>Password</th> -->
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

</div>

<script>

/* Sample Data (Replace with backend API later) */
let doctors = [];

/* Load Table */
function loadTable(data){
  const tbody = document.querySelector("#doctorTable tbody");
  if (!tbody) return;

  tbody.innerHTML = "";

  data.forEach(d=>{
    tbody.innerHTML += `
      <tr>
        <td>${d.id}</td>
        <td>${d.first}</td>
        <td>${d.middle}</td>
        <td>${d.last}</td>
        <td>${d.spec}</td>
        <td>${d.phone}</td>
        <td>${d.email}</td>
        <td>${d.dept}</td>
        <td>${d.from}</td>
        <td>${d.to}</td>
        <td>${d.username}</td>
        <td class="actions">
          <button class="view">View</button>
          <button class="edit">Edit</button>
        </td>
      </tr>
    `;
  });
}

/* Fetch Doctors */
async function fetchDoctors() {
  try {
    const response = await fetch("http://127.0.0.1:5000/api/doctors");
    const data = await response.json();

    doctors = data.map(d => ({
      id: d.doctor_id,
      first: d.first_name,
      middle: d.middle_name,
      last: d.last_name,
      spec: d.specialization,
      phone: d.phone,
      email: d.email,
      dept: d.department_id,
      from: d.available_from || "",
      to: d.available_to || "",
      username: d.username
    }));

    loadTable(doctors);

  } catch (error) {
    console.error("Error fetching doctors:", error);
  }
}

/* DOM Ready */
document.addEventListener("DOMContentLoaded", () => {
  fetchDoctors();

  const searchInput = document.getElementById("search");

  if (searchInput) {
    searchInput.addEventListener("keyup", function(){
      const val = this.value.toLowerCase();

      const filtered = doctors.filter(d =>
        (d.first && d.first.toLowerCase().includes(val)) ||
        (d.spec && d.spec.toLowerCase().includes(val)) ||
        (d.phone && d.phone.includes(val))
      );

      loadTable(filtered);
    });
  }
});
</script>

</body>
</html>
