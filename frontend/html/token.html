<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediQueue</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('/frontend/images/token\ bg.jpeg') no-repeat center center/cover;
  height: 100vh;
  color: #1a237e;
}

/* Overlay blur for readability */
.overlay {
  background: rgba(255,255,255,0.85);
  height: 100%;
  padding: 20px;
}

/* Header */
.header {
  text-align: center;
  margin-top: 20px;
}

.header h1 {
  font-size: 42px;
  color: #1976d2;
  margin-bottom: 10px;
}

.subtitle {
  display: inline-block;
  padding: 10px 30px;
  border-radius: 25px;
  background: linear-gradient(to right, #42a5f5, #1976d2);
  color: white;
  font-size: 16px;
}

/* Token Section */
.token-section {
  text-align: center;
  margin-top: 40px;
}

.token-section h2 {
  color: #555;
}

.token-box {
  display: inline-block;
  background: white;
  padding: 20px 60px;
  border-radius: 15px;
  font-size: 50px;
  font-weight: bold;
  margin-top: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.card {
  width: 250px;
  background: white;
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.card h3 {
  color: #1976d2;
}

/* Button */
.btn {
  text-align: center;
  margin-top: 40px;
}

button {
  background: linear-gradient(to right, #42a5f5, #1976d2);
  color: white;
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  border-radius: 25px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>

</head>

<body>

<div class="overlay">

  <!-- Header -->
  <div class="header">
    <h3>MediQueue</h3>
    <div class="subtitle">OPD Management</div>
  </div>

  <!-- Token Section -->
  <div class="token-section">
    <h2>Your Token Number</h2>
    <div class="token-box" id="token">A-105</div>
  </div>

  <!-- Cards -->
  <div class="cards">

    <div class="card">
      <h3>Current Queue</h3>
      <p id="queue">5 patients ahead of you</p>
    </div>

    <div class="card">
      <h3>Please Wait</h3>
      <p>Your token will be called soon</p>
    </div>

    <div class="card">
      <h3>Notifications</h3>
      <p>Please listen for your token number</p>
    </div>

  </div>

  <!-- Button -->
  <div class="btn">
    <button onclick="printToken()">Print Token</button>
  </div>

</div>

<script>
// Print
function printToken() {
  window.print();
}

// Demo dynamic update (same behavior)
let token = 105;

setInterval(() => {
  token++;
  document.getElementById("token").innerText = "A-" + token;

  let q = Math.floor(Math.random() * 10) + 1;
  document.getElementById("queue").innerText = q + " patients ahead of you";

}, 8000);
</script>

</body>
</html>
