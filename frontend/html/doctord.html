<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #dbe4f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    }

    .sidebar-top {
      padding: 0 20px;
    }

    .logo h2 {
      color: #1e5eff;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .menu {
      list-style: none;
    }

    .menu li {
      margin-bottom: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 17px;
      transition: 0.3s;
    }

    .menu a:hover,
    .menu a.active {
      background: #e8f0ff;
      color: #1e5eff;
      font-weight: 600;
    }

    .menu a i {
      font-size: 18px;
    }

    .logout {
      padding: 0 20px;
    }

    .logout a {
      text-decoration: none;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 17px;
    }

    .logout a:hover {
      background: #f3f6fb;
      color: #1e5eff;
    }

    .main-content {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 25px;
    }

    .topbar {
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 18px;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-left i {
      font-size: 24px;
      color: #4b5563;
      cursor: pointer;
    }

    .topbar-left h1 {
      font-size: 30px;
      color: #111827;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-right i {
      font-size: 22px;
      color: #4b5563;
      cursor: pointer;
    }

    .profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e5eff;
      font-size: 20px;
    }

    .form-card {
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 20px;
      padding: 35px;
    }

    .form-card h2 {
      font-size: 34px;
      color: #111827;
      margin-bottom: 8px;
    }

    .form-card p {
      color: #6b7280;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: span 3;
    }

    .form-group.half {
      grid-column: span 1;
    }

    .form-group label {
      margin-bottom: 10px;
      color: #111827;
      font-weight: 600;
      font-size: 16px;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 1px solid #dbe4f0;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      height: 60px;
    }

    .input-box span {
      width: 60px;
      height: 100%;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e5eff;
      font-size: 18px;
    }

    .input-box input,
    .input-box select {
      border: none;
      outline: none;
      width: 100%;
      height: 100%;
      padding: 0 18px;
      font-size: 15px;
      color: #374151;
      background: transparent;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 30px;
    }

    .btn {
      padding: 14px 35px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }

    .btn-reset {
      background: #ffffff;
      border: 2px solid #1e5eff;
      color: #1e5eff;
    }

    .btn-reset:hover {
      background: #e8f0ff;
    }

    .btn-save {
      background: #1e5eff;
      color: white;
    }

    .btn-save:hover {
      background: #1748c7;
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-group.full {
        grid-column: span 2;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 80px;
      }

      .sidebar .logo h2,
      .sidebar .logo p,
      .sidebar .menu a span,
      .logout a span {
        display: none;
      }

      .main-content {
        margin-left: 80px;
        width: calc(100% - 80px);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: span 1;
      }

      .topbar-left h1 {
        font-size: 22px;
      }
    }

    .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-top: 20px;
}

.detail-item {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
    border-left: 4px solid #4e73df; /* Accents the data */
}

.detail-item label {
    display: block;
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 5px;
    font-weight: 600;
}

.data-value {
    font-size: 1.1rem;
    color: #1e293b;
    font-weight: 500;
}

.detail-item-row {
    display: flex;
    gap: 20px;
    grid-column: span 2;
}

.full-width {
    grid-column: span 2;
}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class=""">
        <h3>MediQueue</h3>
        <p>OPD Management</p>
      </div>

      <ul class="menu">
        <li>
          <a href="doctors.html">
            <i class="fas fa-chart-bar"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="scheduled.html">
            <i class="fas fa-calendar-days"></i>
            <span>Schedule</span>
          </a>
        </li>
        <li>
          <a href="queued.html">
            <i class="fas fa-users"></i>
            <span>Queue</span>
          </a>
        </li>
        <li>
          <a href="doctord.html" class="active">
            <i class="fas fa-user-doctor"></i>
            <span>Doctor</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="logout">
        <a href="index.html">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="login.html">
        <i class="fas fa-right-from-bracket"></i>
        <span>Logout</span>
      </a>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <i class="fas fa-bars"></i>
        <h1>Doctor Details</h1>
      </div>

      <div class="topbar-right">
        <i class="far fa-bell"></i>
        <a href="doctors.html">
        <div class="profile">
          <i class="fas fa-user"></i>
        </a>
        </div>
      </div>
    </div>

    <div class="form-card">
    <div class="details-header">
        <h2>Doctor Profile</h2>
        <p>Official records from the hospital</p>
    </div>

    <div class="details-grid">
        <div class="detail-item">
            <label><i class="fas fa-user"></i> Full Name</label>
            <div class="data-value" id="displayFullName">Loading...</div>
        </div>

        <div class="detail-item">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <div class="data-value" id="displayEmail">Loading...</div>
        </div>

        <div class="detail-item">
            <label><i class="fas fa-phone"></i> Phone Number</label>
            <div class="data-value" id="displayPhone">Loading...</div>
        </div>

        <div class="detail-item">
            <label><i class="fas fa-stethoscope"></i> Specialization</label>
            <div class="data-value" id="displaySpecialization">Loading...</div>
        </div>

        <div class="detail-item-row">
            <div class="detail-item">
                <label><i class="fas fa-clock"></i> Shift Starts</label>
                <div class="data-value" id="displayFrom">Loading...</div>
            </div>
            <div class="detail-item">
                <label><i class="fas fa-clock"></i> Shift Ends</label>
                <div class="data-value" id="displayTo">Loading...</div>
            </div>
        </div>
    </div>
</div>

  <script>

    document.addEventListener('DOMContentLoaded', () => {
    // 1. Retrieve the stored strings
    const userString = localStorage.getItem('user');
    const userRole = localStorage.getItem('role');

    // 2. Security Check: Redirect if no data is found or role is incorrect
    if (!userString || userRole !== 'Doctor') {
        console.warn("Unauthorized access or missing session data. Redirecting to login...");
        window.location.href = 'login.html';
        return;
    }

    // 3. Parse the JSON string into a JavaScript Object
    let doctorData;
    try {
        doctorData = JSON.parse(userString);
    } catch (e) {
        console.error("Error parsing user data:", e);
        window.location.href = 'login.html';
        return;
    }

    // 4. Helper function to update the HTML safely
    const updateDisplay = (id, value) => {
        const element = document.getElementById(id);
        if (element) {
            element.innerText = value || "Not Available";
        }
    };

    // 5. Construct Doctor-specific values matching your Python Module keys
    // Backend uses: first_name, last_name, email, specialization, phone, etc.
    const firstName = doctorData.first_name || "";
    const lastName = doctorData.last_name || "";
    const fullName = (firstName || lastName) ? `Dr. ${firstName} ${lastName}`.trim() : "Not Available";

    // 6. Mapping Database values to your HTML IDs
    updateDisplay('displayFullName', fullName);
    updateDisplay('displayEmail', doctorData.email);
    updateDisplay('displayPhone', doctorData.phone);
    updateDisplay('displaySpecialization', doctorData.specialization);

    // 7. Format Time (Handling datetime.timedelta strings from your module)
    // Your module converts timedeltas to strings like "09:00:00"
    const formatTime = (time) => {
        if (!time) return "Not Set";
        // Takes "09:00:00" and returns "09:00"
        return time.length >= 5 ? time.substring(0, 5) : time;
    };
    
    updateDisplay('displayFrom', formatTime(doctorData.available_from));
    updateDisplay('displayTo', formatTime(doctorData.available_to));

    // 8. Logout Logic
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear(); // Clears 'user' and 'role'
            window.location.href = 'login.html';
        });
    }
});
  </script>

</body>
</html>
