<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/doctor.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      display: flex;
      min-height: 100vh;
    }

    /* .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #dbe4f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    } */

    .sidebar {
  width: 260px;
  background: #ffffff;
  border-right: 1px solid #dbe4f0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px 0;
  position: fixed;
  height: 100vh;
}

/* BRAND */
.brand {
  padding: 0 20px;
  margin-bottom: 30px;
}

.brand-name {
  color: #1e5eff;
  font-size: 24px;
  margin-bottom: 5px;
}

.brand-sub {
  color: #6b7280;
  font-size: 14px;
}


    .sidebar-top {
      padding: 0 20px;
    }

    .logo h2 {
      color: #1e5eff;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .menu {
      list-style: none;
    }

    .menu li {
      margin-bottom: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 17px;
      transition: 0.3s;
    }

    .menu a:hover,
    .menu a.active {
      background: #e8f0ff;
      color: #1e5eff;
      font-weight: 600;
    }

    .menu a i {
      font-size: 18px;
    }

    .logout {
      padding: 0 20px;
    }

    .logout a {
      text-decoration: none;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 17px;
    }

    .logout a:hover {
      background: #f3f6fb;
      color: #1e5eff;
    }

    .main-content {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 25px;
    }

    .topbar {
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 18px;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-left i {
      font-size: 24px;
      color: #4b5563;
      cursor: pointer;
    }

    .topbar-left h1 {
      font-size: 30px;
      color: #111827;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topbar-right i {
      font-size: 22px;
      color: #4b5563;
      cursor: pointer;
    }

    .profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e5eff;
      font-size: 20px;
    }

    .form-card {
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 20px;
      padding: 35px;
    }

    .form-card h2 {
      font-size: 34px;
      color: #111827;
      margin-bottom: 8px;
    }

    .form-card p {
      color: #6b7280;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: span 3;
    }

    .form-group.half {
      grid-column: span 1;
    }

    .form-group label {
      margin-bottom: 10px;
      color: #111827;
      font-weight: 600;
      font-size: 16px;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 1px solid #dbe4f0;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      height: 60px;
    }

    .input-box span {
      width: 60px;
      height: 100%;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e5eff;
      font-size: 18px;
    }

    .input-box input,
    .input-box select {
      border: none;
      outline: none;
      width: 100%;
      height: 100%;
      padding: 0 18px;
      font-size: 15px;
      color: #374151;
      background: transparent;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 30px;
    }

    .btn {
      padding: 14px 35px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }

    .btn-reset {
      background: #ffffff;
      border: 2px solid #1e5eff;
      color: #1e5eff;
    }

    .btn-reset:hover {
      background: #e8f0ff;
    }

    .btn-save {
      background: #1e5eff;
      color: white;
    }

    .btn-save:hover {
      background: #1748c7;
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-group.full {
        grid-column: span 2;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 80px;
      }

      .sidebar .logo h2,
      .sidebar .logo p,
      .sidebar .menu a span,
      .logout a span {
        display: none;
      }

      .main-content {
        margin-left: 80px;
        width: calc(100% - 80px);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: span 1;
      }

      .topbar-left h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

   <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <h3 class="brand-name">MediQueue</h3>
                <p class="brand-sub">OPD Management</p>
            </div>
            <nav class="nav-menu">
                <a href="admin.html" class="nav-link" id="AdminBtn" >
                    <span class="icon">🏥</span> Dashboard
                </a>
                <a href="patienta.html" class="nav-link" id="PatientaBtn" >
                    <span class="icon">👦</span> Patient
                </a>
                 <a href="doctora.html" class="nav-link" id="DoctoraBtn" >
                    <span class="icon">🧑‍⚕️</span> Doctor
                </a>
                <a href="receptionistsa.html" class="nav-link" id="ReceptionistsaBtn" >
                    <span class="icon">👩‍⚕️</span> Receptionist
                </a>
                <a href="queuea.html" class="nav-link" id="QueueaBtn" >
                    <span class="icon">⏰</span> Queue
                </a>
              
            </nav>
            <div class="sidebar-bottom" >
                <a href="index.html" class="nav-link">🏠 Home</a>
                <a href="login.html" class="nav-link logout">🚪Logout</a>
            </div>
        </aside>
    </div>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <i class="fas fa-bars"></i>
        <h1>Receptionists Details</h1>
      </div>

      <div class="topbar-right">
        <i class="far fa-bell"></i>
        <div class="profile">
          <i class="fas fa-user"></i>
        </div>
      </div>
    </div>

    <div class="form-card">
      <!-- <h2>Receptionist Details</h2> -->
      <span><h2>Enter and manage receptionists information</h2></span>

      <form id="receptionistForm">
        <div class="form-grid">

          <div class="form-group">
            <label>First Name</label>
            <div class="input-box">
              <span><i class="fas fa-user"></i></span>
              <input type="text" id="firstName" placeholder="Enter first name">
            </div>
          </div>

          <div class="form-group">
            <label>Middle Name</label>
            <div class="input-box">
              <span><i class="fas fa-user"></i></span>
              <input type="text" id="middleName" placeholder="Enter middle name">
            </div>
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <div class="input-box">
              <span><i class="fas fa-user"></i></span>
              <input type="text" id="lastName" placeholder="Enter last name">
            </div>
          </div>

          <div class="form-group">
            <label>User Name</label>
            <div class="input-box">
              <span><i class="fas fa-user"></i></span>
              <input type="text" id="username" placeholder="username">
            </div>
          </div>


          <div class="form-group full">
            <label>Email</label>
            <div class="input-box">
              <span><i class="fas fa-envelope"></i></span>
              <input type="email" id="email" placeholder="Enter email address">
            </div>
          </div>

          <div class="form-group full">
            <label>Phone No.</label>
            <div class="input-box">
              <span><i class="fas fa-phone"></i></span>
              <input type="tel" id="phone" placeholder="Enter phone number">
            </div>
          </div>

          <div class="form-group full">
            <label>password</label>
            <div class="input-box">
              <span><i class="fas fa-lock"></i></span>
              <input 
                type="password" 
                id="password" 
                placeholder="Enter password"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
                title="Password must contain at least 1 uppercase, 1 lowercase, 1 number, 1 special character, and minimum 8 characters"
                required
                >
            </div>
          </div>

        </div>

        <div class="button-group">
          <button type="reset" class="btn btn-reset">Reset</button>
          <button type="submit" class="btn btn-save">
            <i class="fas fa-floppy-disk"></i> Save Receptionist
          </button>
        </div>
      </form>
    </div>
  </div>
  


<script>

    document.getElementById("receptionistForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

  if (!passwordRegex.test(password)) {
    alert("Password must contain uppercase, lowercase, number, special character and be at least 8 characters long");
    return;
  }

  // Collect form data (Keys match your Python backend data.get calls)
  const receptionistData = {
    firstName: document.getElementById("firstName").value.trim(),
    middleName: document.getElementById("middleName").value.trim(),
    lastName: document.getElementById("lastName").value.trim(),
    username: document.getElementById("username").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    password: password
  };

  // Basic validation
  if (!receptionistData.firstName || !receptionistData.username || !receptionistData.password) {
    alert("First name, username and password are required!");
    return;
  }

  console.log("SENDING TO BACKEND:", receptionistData);

  try {
    const response = await fetch("http://127.0.0.1:5000/api/receptionists/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(receptionistData)
    });

    const result = await response.json();

    if (response.ok) {
      alert("Receptionist registered successfully!");
      document.getElementById("receptionistForm").reset();
    } else {
      alert("Error: " + (result.message || "Something went wrong"));
    }

  } catch (error) {
    console.error("ERROR:", error);
    alert("Backend not running or API error!");
  }
});
</script>

</body>
</html>
