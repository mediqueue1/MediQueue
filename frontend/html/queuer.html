<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - MediQueue</title>
    <link rel="stylesheet" href="../css/patient.css">
    <link rel="stylesheet" href="../css/token.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/receptionists.css">

 <style>
  /* Table Container */
.table-container {
  width: 130vh;
  margin: 40px auto;
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  overflow: hidden;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: linear-gradient(to right, #42a5f5, #1976d2);
  color: white;
  padding: 15px;
  font-size: 18px;
}

td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  font-size: 16px;
  text-align: center;
}

/* Highlight current */
.current {
  background: linear-gradient(to right, #66bb6a, #43a047);
  color: white;
  font-weight: bold;
}
 </style>   
</head>
<body>
 <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class=""></span>
                <div>
                    <h2>MediQueue</h2>
                    <p>OPD Management</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="receptionists.html" class="nav-item"><span>🏥</span> Dashboard</a>
                <a href="queuer.html" class="nav-item"><span>⏰</span> Queue</a>
                <a href="patientr.html" class="nav-item"><span>👦</span> Patients</a>
                <a href="scheduler.html" class="nav-item"><span>📅</span> Schedule</a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="nav-item"><span>🏠</span>Home</a>
                <a href="login.html" class="nav-item" id="logoutBtn"><span>🚪</span> Logout</a>
            </div>
        </aside>


<div class="overlay">

  <!-- Header -->
  <div class="header">
    <h1>MediQueue</h1>
    <div class="subtitle">Outpatient Queue & Token Management System</div>
  </div>

<div class="table-container">
    <table id="queueTable">
  <thead>
    <tr>
      <th>Queue</th>
      <th>Token Number</th>
      <th>Patient_id</th>
      <th>Patient Name</th>
      <th>Doctor Name</th>
      <th>Appointment_date</th>
      <th>appointment_time</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <!-- DATA WILL COME HERE -->
  </tbody>
</table>
  </div>
  <script>
async function loadQueue() {
  try {
    const response = await fetch("http://127.0.0.1:5000/api/queue");
    const data = await response.json();

    const tbody = document.querySelector("#queueTable tbody");
    tbody.innerHTML = "";

    // ✅ ADD THIS: filter required statuses
    const filteredData = data.filter(item =>
      item.status === "scheduled" || item.status === "in_consultation"
    );

    // ✅ OPTIONAL: show message if empty
    if (filteredData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7">No patients in queue</td>
        </tr>
      `;
      return;
    }

    // ✅ ADD THIS: sort so in_consultation comes first
    filteredData.sort((a, b) => {
      if (a.status === "in_consultation") return -1;
      if (b.status === "in_consultation") return 1;
      return a.token_number - b.token_number;
    });

    filteredData.forEach((item, index) => {

      // ✅ ADD THIS: status label
      let statusLabel = "";
      if (item.status === "in_consultation") {
        statusLabel = "In Consultation";
      } else {
        statusLabel = "Waiting";
      }

      tbody.innerHTML += `
        <tr ${item.status === "in_consultation" ? 'class="current"' : ''}>
          <td>${index + 1}</td>
          <td>A-${item.token_number || '-'}</td>
          <td>${item.patient_id}</td>
          <td>${item.full_name || '-'}</td>
          <td>Dr. ${item.doctor_name || '-'}</td>
          <td>${item.appointment_date}</td>
          <td>${item.appointment_time}</td>
          <td>${statusLabel}</td>
        </tr>
      `;
    });

  } catch (error) {
    console.error("Queue load error:", error);
  }
}

loadQueue();
</script>
</body>
</html>
